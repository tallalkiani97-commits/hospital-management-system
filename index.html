<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow HMS</title><style>body{font:16px Arial;margin:0;background:#f4f7fb;color:#14233b}header{background:#123c69;color:#fff;padding:28px 7vw}main{max-width:1100px;margin:30px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 18px #123c6914}.num{font-size:34px;font-weight:bold}form{display:grid;gap:10px;max-width:500px}input,button{padding:12px;border:1px solid #ccd6e3;border-radius:8px}button{background:#0d8f86;color:#fff;border:0;cursor:pointer}</style></head><body><header><h1>CareFlow HMS</h1><p>Hospital workflow prototype</p></header><main><div class=grid><div class=card><div class=num>128</div><p>Registered patients</p></div><div class=card><div class=num>24</div><p>Today's appointments</p></div><div class=card><div class=num>08</div><p>Available doctors</p></div></div><section class=card style="margin-top:24px"><h2>Register patient</h2><form onsubmit="event.preventDefault();alert('Demo record saved locally for this session.')"><input required placeholder="Patient name"><input required placeholder="Department"><input type=date required><button>Save demo record</button></form></section></main></body></html>
